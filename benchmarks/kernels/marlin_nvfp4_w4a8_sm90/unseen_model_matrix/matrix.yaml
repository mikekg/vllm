schema_version: 1
purpose: cached unseen-model validation for generic NVFP4 hybrid selectors

runtime:
  root: /lustre/fs1/portfolios/sw/projects/sw_aidot/users/mgschwind/w4a8-hopper-unified/w4a8-cuda-converter-only
  image: /lustre/fs1/portfolios/sw/projects/sw_aidot/users/mgschwind/mmpareto/containers/vllm_v0.24.0.sqsh
  shared_scripts: /lustre/fs1/portfolios/sw/projects/sw_aidot/users/mgschwind/mmpareto/scripts
  gsm8k_data: /lustre/fs1/portfolios/sw/projects/sw_aidot/users/mgschwind/w4a8-hopper-unified/w4a8-cuda-converter-only/data/gsm8k
  results: /lustre/fs1/portfolios/sw/projects/sw_aidot/users/mgschwind/w4a8-hopper-unified/w4a8-cuda-converter-only/results/unseen-model-matrix

selector:
  moe_knee_formula: floor(256 * global_experts / top_k) + 1
  dense_eligibility: W4A16_NVFP4 only; router gates always use Marlin
  moe_eligibility: W4A16_NVFP4 only; native NVFP4 W4A4 is unchanged

matrix:
  variants: [native_reference, adaptive]
  concurrencies: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512]
  output_tokens: 1024
  random_range_ratio: 0.8
  kv_cache_memory_bytes: 8589934592
  workloads:
    - {id: 1k1k, input_tokens: 1024, max_model_len: 2112}
    - {id: 5k1k, input_tokens: 5120, max_model_len: 6208}
    - {id: 8k1k, input_tokens: 8192, max_model_len: 9280}
    - {id: 50k1k, input_tokens: 51200, max_model_len: 52288}
  accuracy:
    dataset: gsm8k
    examples: 1319
    save_per_example_outputs: true
    compare: [native_reference, adaptive]

